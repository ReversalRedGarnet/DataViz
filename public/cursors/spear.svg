<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Spearhead blade: tip is the hotspot, at (2,2) -->
  <path d="M 2,2 L 13,13 L 9,17 L 5,13 Z" fill="#24333A"/>
  <!-- Rim-light highlight along one blade edge for a "shiny" read -->
  <path d="M 2,2 L 13,13 L 10.5,15.5 Z" fill="none" stroke="#7A8183" stroke-width="1" stroke-linejoin="round"/>
  <!-- Shaft -->
  <path d="M 9,17 L 22,30 L 19,30 L 7,18 Z" fill="#24333A"/>
  <!-- Small binding/barb detail on the shaft -->
  <line x1="12" y1="20" x2="15" y2="17" stroke="#24333A" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="15" y1="23" x2="18" y2="20" stroke="#24333A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
